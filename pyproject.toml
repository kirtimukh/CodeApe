[project]
name = "codeape"
version = "0.1.0"
description = "Type through a repo's git history, lesson by lesson."
requires-python = ">=3.11"
dependencies = [
    "textual>=0.80",
    "pygments>=2.18",
    "unidiff>=0.7",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
codeape = "codeape.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
